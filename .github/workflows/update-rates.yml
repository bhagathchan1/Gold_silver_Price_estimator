name: Update rates
on:
  schedule:
    - cron: "15 */2 * * *"   # every 2 hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_rates.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          # ignore timestamp-only changes
          if git diff --cached --quiet; then exit 0; fi
          if [ "$(git diff --cached -U0 rates.json | grep -E '^[+-] ' | grep -vc updatedAt)" = "0" ] && git cat-file -e HEAD:rates.json 2>/dev/null; then echo "only timestamp changed"; exit 0; fi
          git commit -m "Update rates"
          git push
